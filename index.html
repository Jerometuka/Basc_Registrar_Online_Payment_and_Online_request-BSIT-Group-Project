<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velvet Roast</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Georgia', serif;
            background-color: #000;
            color: #fff;
        }
        .hero-bg {
            /* Nilagyan ko ng dark gradient at coffee background image para bumalik ang design */
            background-image: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.8)), url('https://images.unsplash.com/photo-1497935586351-b67a49e012bf?q=80&w=2071&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 100vh;
        }
        .gold-text { color: #d4af37; }
        .gold-bg { background-color: #d4af37; color: black; }
        .gold-border { border: 1px solid #d4af37; color: #d4af37; }
    </style>
</head>
<body class="hero-bg flex flex-col">
    <!-- Navbar -->
    <nav class="flex justify-between items-center px-10 py-6">
        <div class="text-sm font-bold tracking-widest text-white flex items-center gap-2">
            <span class="gold-text text-xl">☕</span> VELVET ROAST
        </div>
        <div class="hidden md:flex space-x-8 text-xs uppercase tracking-widest text-gray-300">
            <a href="#" class="hover:text-white transition">Home</a>
            <a href="#" class="hover:text-white transition">Our Menu</a>
            <a href="#" class="hover:text-white transition">The Experience</a>
        </div>
        <button class="gold-border px-6 py-2 rounded-full text-xs uppercase tracking-widest hover:bg-[#d4af37] hover:text-black transition">Sign In</button>
    </nav>

    <!-- Hero Section -->
    <main class="flex-grow flex flex-col items-center justify-center text-center px-4 -mt-20">
        <p class="text-xs uppercase tracking-widest gold-text mb-4 font-sans">EST. 2024</p>
        <h1 class="text-5xl md:text-6xl font-normal mb-6 leading-tight">
            Experience the <br>
            <span class="gold-text">Finest Drinks in Town</span>
        </h1>
        <p class="max-w-md text-gray-300 text-sm mb-10 font-sans leading-relaxed">
            Indulge in artisanal coffees crafted with ethically sourced beans and a touch of golden perfection.
        </p>
        <div class="flex space-x-4 font-sans">
            <button class="gold-bg px-8 py-3 rounded-full text-sm font-semibold hover:bg-yellow-600 transition">Explore Menu</button>
            <button class="border border-gray-400 text-gray-300 px-8 py-3 rounded-full text-sm font-semibold hover:border-white hover:text-white transition">Join the Club</button>
        </div>
    </main>
</body>
</html>
